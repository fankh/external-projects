
    <svg width="1100" height="380" xmlns="http://www.w3.org/2000/svg">
        
    <defs>
        <linearGradient id="gradient_blue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#4589ff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0f62fe;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="gradient_success" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#a7f0ba;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#198038;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="gradient_purple" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#e8daff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#8a3ffc;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="gradient_dark" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#393939;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1c1c1c;stop-opacity:1" />
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#161616" flood-opacity="0.15"/>
        </filter>
        <filter id="shadow_light" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#161616" flood-opacity="0.1"/>
        </filter>
    </defs>
    
        <style>
            .phase-number { font-family: 'Segoe UI', Arial, sans-serif; font-size: 36px; font-weight: 700; fill: #ffffff; opacity: 0.3; }
            .phase-name { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #ffffff; }
            .activity { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #ffffff; opacity: 0.9; }
            .arrow { fill: #a8a8a8; }
        </style>

        <!-- Background -->
        <rect width="1100" height="380" fill="#ffffff" rx="8"/>
    
        <g transform="translate(30, 40)">
            <!-- Card background -->
            <rect width="200" height="280" rx="12" fill="#009d9a" filter="url(#shadow)"/>

            <!-- Phase number watermark -->
            <text class="phase-number" x="15" y="50">01</text>

            <!-- Phase name -->
            <text class="phase-name" x="100" y="85" text-anchor="middle">Foundation</text>

            <!-- Divider line -->
            <line x1="20" y1="100" x2="180" y2="100" stroke="#ffffff" stroke-width="1" opacity="0.3"/>

            <!-- Activities -->
        
            <g transform="translate(20, 120)">
                <circle cx="8" cy="8" r="4" fill="#ffffff" opacity="0.5"/>
                <text class="activity" x="20" y="12">Environment Setup</text>
            </g>
            
            <g transform="translate(20, 158)">
                <circle cx="8" cy="8" r="4" fill="#ffffff" opacity="0.5"/>
                <text class="activity" x="20" y="12">Network Validation</text>
            </g>
            
            <g transform="translate(20, 196)">
                <circle cx="8" cy="8" r="4" fill="#ffffff" opacity="0.5"/>
                <text class="activity" x="20" y="12">Platform Install</text>
            </g>
            
            <g transform="translate(20, 234)">
                <circle cx="8" cy="8" r="4" fill="#ffffff" opacity="0.5"/>
                <text class="activity" x="20" y="12">Health Check</text>
            </g>
            </g>
            <g transform="translate(232, 170)">
                <polygon class="arrow" points="0,10 15,10 15,0 25,15 15,30 15,20 0,20"/>
            </g>
            
        <g transform="translate(255, 40)">
            <!-- Card background -->
            <rect width="200" height="280" rx="12" fill="#0f62fe" filter="url(#shadow)"/>

            <!-- Phase number watermark -->
            <text class="phase-number" x="15" y="50">02</text>

            <!-- Phase name -->
            <text class="phase-name" x="100" y="85" text-anchor="middle">Integration</text>

            <!-- Divider line -->
            <line x1="20" y1="100" x2="180" y2="100" stroke="#ffffff" stroke-width="1" opacity="0.3"/>

            <!-- Activities -->
        
            <g transform="translate(20, 120)">
                <circle cx="8" cy="8" r="4" fill="#ffffff" opacity="0.5"/>
                <text class="activity" x="20" y="12">P1 Sources</text>
            </g>
            
            <g transform="translate(20, 158)">
                <circle cx="8" cy="8" r="4" fill="#ffffff" opacity="0.5"/>
                <text class="activity" x="20" y="12">Parser Dev</text>
            </g>
            
            <g transform="translate(20, 196)">
                <circle cx="8" cy="8" r="4" fill="#ffffff" opacity="0.5"/>
                <text class="activity" x="20" y="12">P2 Sources</text>
            </g>
            
            <g transform="translate(20, 234)">
                <circle cx="8" cy="8" r="4" fill="#ffffff" opacity="0.5"/>
                <text class="activity" x="20" y="12">Validation</text>
            </g>
            </g>
            <g transform="translate(457, 170)">
                <polygon class="arrow" points="0,10 15,10 15,0 25,15 15,30 15,20 0,20"/>
            </g>
            
        <g transform="translate(480, 40)">
            <!-- Card background -->
            <rect width="200" height="280" rx="12" fill="#8a3ffc" filter="url(#shadow)"/>

            <!-- Phase number watermark -->
            <text class="phase-number" x="15" y="50">03</text>

            <!-- Phase name -->
            <text class="phase-name" x="100" y="85" text-anchor="middle">Detection</text>

            <!-- Divider line -->
            <line x1="20" y1="100" x2="180" y2="100" stroke="#ffffff" stroke-width="1" opacity="0.3"/>

            <!-- Activities -->
        
            <g transform="translate(20, 120)">
                <circle cx="8" cy="8" r="4" fill="#ffffff" opacity="0.5"/>
                <text class="activity" x="20" y="12">Use Cases</text>
            </g>
            
            <g transform="translate(20, 158)">
                <circle cx="8" cy="8" r="4" fill="#ffffff" opacity="0.5"/>
                <text class="activity" x="20" y="12">Alert Config</text>
            </g>
            
            <g transform="translate(20, 196)">
                <circle cx="8" cy="8" r="4" fill="#ffffff" opacity="0.5"/>
                <text class="activity" x="20" y="12">Dashboards</text>
            </g>
            
            <g transform="translate(20, 234)">
                <circle cx="8" cy="8" r="4" fill="#ffffff" opacity="0.5"/>
                <text class="activity" x="20" y="12">Tuning</text>
            </g>
            </g>
            <g transform="translate(682, 170)">
                <polygon class="arrow" points="0,10 15,10 15,0 25,15 15,30 15,20 0,20"/>
            </g>
            
        <g transform="translate(705, 40)">
            <!-- Card background -->
            <rect width="200" height="280" rx="12" fill="#0353e9" filter="url(#shadow)"/>

            <!-- Phase number watermark -->
            <text class="phase-number" x="15" y="50">04</text>

            <!-- Phase name -->
            <text class="phase-name" x="100" y="85" text-anchor="middle">Transition</text>

            <!-- Divider line -->
            <line x1="20" y1="100" x2="180" y2="100" stroke="#ffffff" stroke-width="1" opacity="0.3"/>

            <!-- Activities -->
        
            <g transform="translate(20, 120)">
                <circle cx="8" cy="8" r="4" fill="#ffffff" opacity="0.5"/>
                <text class="activity" x="20" y="12">Documentation</text>
            </g>
            
            <g transform="translate(20, 158)">
                <circle cx="8" cy="8" r="4" fill="#ffffff" opacity="0.5"/>
                <text class="activity" x="20" y="12">Training</text>
            </g>
            
            <g transform="translate(20, 196)">
                <circle cx="8" cy="8" r="4" fill="#ffffff" opacity="0.5"/>
                <text class="activity" x="20" y="12">UAT</text>
            </g>
            
            <g transform="translate(20, 234)">
                <circle cx="8" cy="8" r="4" fill="#ffffff" opacity="0.5"/>
                <text class="activity" x="20" y="12">Sign-off</text>
            </g>
            </g>
        <g transform="translate(30, 340)">
            <rect width="840" height="45" rx="6" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>

            <g transform="translate(40, 15)">
                <text font-family="Segoe UI" font-size="11" fill="#6f6f6f">Total Duration:</text>
                <text font-family="Segoe UI" font-size="13" font-weight="600" fill="#0f62fe" x="95" y="0">[X] Weeks</text>
            </g>

            <g transform="translate(260, 15)">
                <text font-family="Segoe UI" font-size="11" fill="#6f6f6f">Key Dependencies:</text>
                <text font-family="Segoe UI" font-size="13" font-weight="600" fill="#0f62fe" x="110" y="0">Infrastructure, Access, Resources</text>
            </g>

            <g transform="translate(600, 15)">
                <text font-family="Segoe UI" font-size="11" fill="#6f6f6f">Delivery Model:</text>
                <text font-family="Segoe UI" font-size="13" font-weight="600" fill="#0f62fe" x="90" y="0">Agile / Iterative</text>
            </g>
        </g>
    </svg>