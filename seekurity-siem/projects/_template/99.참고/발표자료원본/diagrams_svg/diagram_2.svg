
    <svg width="1100" height="340" xmlns="http://www.w3.org/2000/svg">
        
    <defs>
        <linearGradient id="gradient_blue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#4589ff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0f62fe;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="gradient_success" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#a7f0ba;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#198038;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="gradient_purple" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#e8daff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#8a3ffc;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="gradient_dark" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#393939;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1c1c1c;stop-opacity:1" />
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#161616" flood-opacity="0.15"/>
        </filter>
        <filter id="shadow_light" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#161616" flood-opacity="0.1"/>
        </filter>
    </defs>
    
        <style>
            .stage-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
            .stage-subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; fill: #ffffff; text-anchor: middle; opacity: 0.8; }
            .arrow { fill: #a8a8a8; }
            .flow-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; fill: #6f6f6f; text-anchor: middle; }
            .metric { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #0f62fe; text-anchor: middle; }
        </style>

        <!-- Background -->
        <rect width="1100" height="340" fill="#ffffff" rx="8"/>

        <!-- Stage 1: Sources -->
        <g transform="translate(30, 80)">
            <rect width="120" height="150" rx="8" fill="#009d9a" filter="url(#shadow)"/>
            <text class="stage-title" x="60" y="40">Sources</text>
            <line x1="20" y1="55" x2="100" y2="55" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
            <text class="stage-subtitle" x="60" y="80">Firewall</text>
            <text class="stage-subtitle" x="60" y="98">EDR</text>
            <text class="stage-subtitle" x="60" y="116">Identity</text>
            <text class="stage-subtitle" x="60" y="134">Cloud</text>
        </g>

        <!-- Arrow 1 -->
        <g transform="translate(160, 145)">
            <polygon class="arrow" points="0,10 40,10 40,0 60,15 40,30 40,20 0,20"/>
            <text class="flow-label" x="30" y="50">Raw Logs</text>
            <text class="metric" x="30" y="65">[X] EPS</text>
        </g>

        <!-- Stage 2: Collection -->
        <g transform="translate(230, 80)">
            <rect width="120" height="150" rx="8" fill="#4589ff" filter="url(#shadow)"/>
            <text class="stage-title" x="60" y="40">Collection</text>
            <line x1="20" y1="55" x2="100" y2="55" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
            <text class="stage-subtitle" x="60" y="80">Syslog</text>
            <text class="stage-subtitle" x="60" y="98">API Pull</text>
            <text class="stage-subtitle" x="60" y="116">Agent</text>
            <text class="stage-subtitle" x="60" y="134">Forwarder</text>
        </g>

        <!-- Arrow 2 -->
        <g transform="translate(360, 145)">
            <polygon class="arrow" points="0,10 40,10 40,0 60,15 40,30 40,20 0,20"/>
            <text class="flow-label" x="30" y="50">Parsed</text>
            <text class="metric" x="30" y="65">[X] EPS</text>
        </g>

        <!-- Stage 3: Processing -->
        <g transform="translate(430, 80)">
            <rect width="120" height="150" rx="8" fill="#0f62fe" filter="url(#shadow)"/>
            <text class="stage-title" x="60" y="40">Processing</text>
            <line x1="20" y1="55" x2="100" y2="55" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
            <text class="stage-subtitle" x="60" y="80">Normalize</text>
            <text class="stage-subtitle" x="60" y="98">Enrich</text>
            <text class="stage-subtitle" x="60" y="116">Correlate</text>
            <text class="stage-subtitle" x="60" y="134">Index</text>
        </g>

        <!-- Arrow 3 -->
        <g transform="translate(560, 145)">
            <polygon class="arrow" points="0,10 40,10 40,0 60,15 40,30 40,20 0,20"/>
            <text class="flow-label" x="30" y="50">Indexed</text>
            <text class="metric" x="30" y="65">[X] GB/day</text>
        </g>

        <!-- Stage 4: Storage -->
        <g transform="translate(630, 80)">
            <rect width="120" height="150" rx="8" fill="#0353e9" filter="url(#shadow)"/>
            <text class="stage-title" x="60" y="40">Storage</text>
            <line x1="20" y1="55" x2="100" y2="55" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
            <text class="stage-subtitle" x="60" y="80">Hot: 7 days</text>
            <text class="stage-subtitle" x="60" y="98">Warm: 30 days</text>
            <text class="stage-subtitle" x="60" y="116">Cold: 90 days</text>
            <text class="stage-subtitle" x="60" y="134">Archive: 1 yr</text>
        </g>

        <!-- Arrow 4 -->
        <g transform="translate(760, 145)">
            <polygon class="arrow" points="0,10 40,10 40,0 60,15 40,30 40,20 0,20"/>
            <text class="flow-label" x="30" y="50">Query</text>
        </g>

        <!-- Stage 5: Analysis -->
        <g transform="translate(830, 80)">
            <rect width="50" height="150" rx="8" fill="#8a3ffc" filter="url(#shadow)"/>
            <text class="stage-title" x="25" y="85" transform="rotate(-90, 25, 85)">Analysis</text>
        </g>

        <!-- Bottom metrics bar -->
        <g transform="translate(30, 270)">
            <rect width="850" height="60" rx="6" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="1"/>
            <g transform="translate(50, 20)">
                <text class="flow-label" x="0" y="0">Total Sources</text>
                <text class="metric" x="0" y="20">[X]</text>
            </g>
            <g transform="translate(200, 20)">
                <text class="flow-label" x="0" y="0">Avg Latency</text>
                <text class="metric" x="0" y="20">&lt;30s</text>
            </g>
            <g transform="translate(350, 20)">
                <text class="flow-label" x="0" y="0">Parse Rate</text>
                <text class="metric" x="0" y="20">&gt;95%</text>
            </g>
            <g transform="translate(500, 20)">
                <text class="flow-label" x="0" y="0">Daily Volume</text>
                <text class="metric" x="0" y="20">[X] GB</text>
            </g>
            <g transform="translate(650, 20)">
                <text class="flow-label" x="0" y="0">Retention</text>
                <text class="metric" x="0" y="20">[X] Days</text>
            </g>
            <g transform="translate(800, 20)">
                <text class="flow-label" x="0" y="0">Uptime</text>
                <text class="metric" x="0" y="20">99.9%</text>
            </g>
        </g>
    </svg>
    