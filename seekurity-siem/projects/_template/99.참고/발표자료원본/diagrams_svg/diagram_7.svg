
    <svg width="1100" height="220" xmlns="http://www.w3.org/2000/svg">
        
    <defs>
        <linearGradient id="gradient_blue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#4589ff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0f62fe;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="gradient_success" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#a7f0ba;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#198038;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="gradient_purple" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#e8daff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#8a3ffc;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="gradient_dark" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#393939;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1c1c1c;stop-opacity:1" />
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#161616" flood-opacity="0.15"/>
        </filter>
        <filter id="shadow_light" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#161616" flood-opacity="0.1"/>
        </filter>
    </defs>
    
        <style>
            .milestone-name { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #393939; text-anchor: middle; }
            .milestone-date { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; fill: #6f6f6f; text-anchor: middle; }
            .status-complete { fill: #198038; }
            .status-active { fill: #0f62fe; }
            .status-pending { fill: #8d8d8d; }
        </style>

        <!-- Background -->
        <rect width="1100" height="220" fill="#ffffff" rx="8"/>

        <!-- Main timeline -->
        <line x1="50" y1="110" x2="1050" y2="110"
              stroke="#c6c6c6" stroke-width="4" stroke-linecap="round"/>
    
        <line x1="50" y1="110" x2="350.0" y2="110"
              stroke="#198038" stroke-width="4" stroke-linecap="round"/>
        
        <circle cx="50" cy="110" r="20" fill="#198038" filter="url(#shadow_light)"/>
        
            <path d="M43 110 l5 5 l9 -9" stroke="#ffffff" stroke-width="3" fill="none"/>
            
            <text class="milestone-name" x="50" y="70">Kickoff</text>
            
        <text class="milestone-date" x="50" y="155">Week 1</text>
        
        <circle cx="250" cy="110" r="20" fill="#198038" filter="url(#shadow_light)"/>
        
            <path d="M243 110 l5 5 l9 -9" stroke="#ffffff" stroke-width="3" fill="none"/>
            
            <text class="milestone-name" x="250" y="70">Platform</text>
            
            <text class="milestone-name" x="250" y="84">Deployed</text>
            
        <text class="milestone-date" x="250" y="155">Week 2</text>
        
        <circle cx="450" cy="110" r="20" fill="#0f62fe" filter="url(#shadow_light)"/>
        
            <text x="450" y="115" text-anchor="middle"
                  font-family="Segoe UI" font-size="14" font-weight="600" fill="#ffffff">3</text>
            
            <text class="milestone-name" x="450" y="70">Sources</text>
            
            <text class="milestone-name" x="450" y="84">Integrated</text>
            
        <text class="milestone-date" x="450" y="155">Week 6</text>
        
        <circle cx="650" cy="110" r="20" fill="#8d8d8d" filter="url(#shadow_light)"/>
        
            <text x="650" y="115" text-anchor="middle"
                  font-family="Segoe UI" font-size="14" font-weight="600" fill="#ffffff">4</text>
            
            <text class="milestone-name" x="650" y="70">Use Cases</text>
            
            <text class="milestone-name" x="650" y="84">Deployed</text>
            
        <text class="milestone-date" x="650" y="155">Week 9</text>
        
        <circle cx="850" cy="110" r="20" fill="#8d8d8d" filter="url(#shadow_light)"/>
        
            <text x="850" y="115" text-anchor="middle"
                  font-family="Segoe UI" font-size="14" font-weight="600" fill="#ffffff">5</text>
            
            <text class="milestone-name" x="850" y="70">Training</text>
            
            <text class="milestone-name" x="850" y="84">Complete</text>
            
        <text class="milestone-date" x="850" y="155">Week 10</text>
        
        <circle cx="1050" cy="110" r="20" fill="#8d8d8d" filter="url(#shadow_light)"/>
        
            <text x="1050" y="115" text-anchor="middle"
                  font-family="Segoe UI" font-size="14" font-weight="600" fill="#ffffff">6</text>
            
            <text class="milestone-name" x="1050" y="70">Go-Live</text>
            
        <text class="milestone-date" x="1050" y="155">Week 11</text>
        
        <g transform="translate(820, 190)">
            <circle cx="10" cy="0" r="8" fill="#198038"/>
            <text class="milestone-date" x="25" y="4" text-anchor="start">Complete</text>

            <circle cx="100" cy="0" r="8" fill="#0f62fe"/>
            <text class="milestone-date" x="115" y="4" text-anchor="start">In Progress</text>

            <circle cx="200" cy="0" r="8" fill="#8d8d8d"/>
            <text class="milestone-date" x="215" y="4" text-anchor="start">Pending</text>
        </g>
    </svg>
        <g transform="translate(820, 190)">
            <circle cx="10" cy="0" r="8" fill="#198038"/>
            <text class="milestone-date" x="25" y="4" text-anchor="start">Complete</text>

            <circle cx="100" cy="0" r="8" fill="#0f62fe"/>
            <text class="milestone-date" x="115" y="4" text-anchor="start">In Progress</text>

            <circle cx="200" cy="0" r="8" fill="#8d8d8d"/>
            <text class="milestone-date" x="215" y="4" text-anchor="start">Pending</text>
        </g>
    </svg>