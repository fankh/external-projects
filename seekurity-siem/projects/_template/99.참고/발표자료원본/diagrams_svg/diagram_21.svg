
    <svg width="150" height="180" xmlns="http://www.w3.org/2000/svg">
        <style>
            .ring-value { font-family: 'Segoe UI', Arial, sans-serif; font-size: 28px; font-weight: 700; fill: #393939; text-anchor: middle; }
            .ring-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #6f6f6f; text-anchor: middle; }
        </style>

        <!-- Background ring -->
        <circle cx="75" cy="75" r="60" fill="none"
                stroke="#e0e0e0" stroke-width="12"/>

        <!-- Progress ring -->
        <circle cx="75" cy="75" r="60" fill="none"
                stroke="#198038" stroke-width="12"
                stroke-linecap="round"
                stroke-dasharray="376.99111843077515"
                stroke-dashoffset="18.849555921538773"
                transform="rotate(-90 75 75)"/>

        <!-- Center value -->
        <text class="ring-value" x="75" y="83">95%</text>

        <!-- Label -->
        <text class="ring-label" x="75" y="170">Parse Rate</text>
    </svg>
    