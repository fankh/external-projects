
    <svg width="1100" height="180" xmlns="http://www.w3.org/2000/svg">
        
    <defs>
        <linearGradient id="gradient_blue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#4589ff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0f62fe;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="gradient_success" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#a7f0ba;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#198038;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="gradient_purple" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#e8daff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#8a3ffc;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="gradient_dark" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#393939;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1c1c1c;stop-opacity:1" />
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#161616" flood-opacity="0.15"/>
        </filter>
        <filter id="shadow_light" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#161616" flood-opacity="0.1"/>
        </filter>
    </defs>
    
        <style>
            .phase-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
            .phase-duration { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #ffffff; text-anchor: middle; opacity: 0.8; }
            .phase-number { font-family: 'Segoe UI', Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #ffffff; text-anchor: middle; opacity: 0.3; }
            .timeline-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; fill: #6f6f6f; text-anchor: middle; }
        </style>

        <!-- Background -->
        <rect width="1100" height="180" fill="#ffffff" rx="8"/>

        <!-- Timeline base line -->
        <line x1="50" y1="140" x2="1050" y2="140"
              stroke="#c6c6c6" stroke-width="3" stroke-linecap="round"/>
    
        <g transform="translate(50, 30)">
            <rect width="230" height="80" rx="6" fill="#009d9a" filter="url(#shadow_light)"/>
            <text class="phase-number" x="115" y="30">1</text>
            <text class="phase-title" x="115" y="50">Optimize</text>
            <text class="phase-duration" x="115" y="68">Q1</text>
        </g>
        
        <circle cx="165" cy="140" r="12"
                fill="#0f62fe" stroke="#ffffff" stroke-width="3"/>
        
        <line x1="165" y1="110" x2="165" y2="128"
              stroke="#009d9a" stroke-width="2" stroke-dasharray="4,2"/>
        
        <g transform="translate(300, 30)">
            <rect width="230" height="80" rx="6" fill="#0f62fe" filter="url(#shadow_light)"/>
            <text class="phase-number" x="115" y="30">2</text>
            <text class="phase-title" x="115" y="50">Expand</text>
            <text class="phase-duration" x="115" y="68">Q2</text>
        </g>
        
        <circle cx="415" cy="140" r="12"
                fill="#8d8d8d" stroke="#ffffff" stroke-width="3"/>
        
        <line x1="415" y1="110" x2="415" y2="128"
              stroke="#0f62fe" stroke-width="2" stroke-dasharray="4,2"/>
        
        <g transform="translate(550, 30)">
            <rect width="230" height="80" rx="6" fill="#8a3ffc" filter="url(#shadow_light)"/>
            <text class="phase-number" x="115" y="30">3</text>
            <text class="phase-title" x="115" y="50">Automate</text>
            <text class="phase-duration" x="115" y="68">Q3</text>
        </g>
        
        <circle cx="665" cy="140" r="12"
                fill="#8d8d8d" stroke="#ffffff" stroke-width="3"/>
        
        <line x1="665" y1="110" x2="665" y2="128"
              stroke="#8a3ffc" stroke-width="2" stroke-dasharray="4,2"/>
        
        <g transform="translate(800, 30)">
            <rect width="230" height="80" rx="6" fill="#0353e9" filter="url(#shadow_light)"/>
            <text class="phase-number" x="115" y="30">4</text>
            <text class="phase-title" x="115" y="50">Mature</text>
            <text class="phase-duration" x="115" y="68">Q4</text>
        </g>
        
        <circle cx="915" cy="140" r="12"
                fill="#8d8d8d" stroke="#ffffff" stroke-width="3"/>
        
        <line x1="915" y1="110" x2="915" y2="128"
              stroke="#0353e9" stroke-width="2" stroke-dasharray="4,2"/>
        
        <text class="timeline-label" x="50" y="165">Start</text>
        <text class="timeline-label" x="1050" y="165">Go-Live</text>
    </svg>