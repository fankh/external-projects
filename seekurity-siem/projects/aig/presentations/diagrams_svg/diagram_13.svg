
    <svg width="450" height="280" xmlns="http://www.w3.org/2000/svg">
        
    <defs>
        <linearGradient id="gradient_blue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#4589ff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0f62fe;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="gradient_success" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#a7f0ba;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#198038;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="gradient_purple" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#e8daff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#8a3ffc;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="gradient_dark" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#393939;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1c1c1c;stop-opacity:1" />
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#161616" flood-opacity="0.15"/>
        </filter>
        <filter id="shadow_light" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#161616" flood-opacity="0.1"/>
        </filter>
    </defs>
    
        <style>
            .item-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #393939; }
            .item-detail { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #6f6f6f; }
        </style>

        <!-- Background -->
        <rect width="450" height="280" fill="#ffffff" rx="8" stroke="#e0e0e0" stroke-width="1" filter="url(#shadow_light)"/>

        <!-- Title -->
        <rect width="450" height="40" fill="#f4f4f4" rx="8"/>
        <rect y="32" width="450" height="8" fill="#f4f4f4"/>
        <text font-family="Segoe UI" font-size="14" font-weight="600" fill="#393939" x="20" y="26">System Status</text>
    
        <g transform="translate(30, 63)">
            <circle r="10" fill="#198038" opacity="0.2"/>
            <path d="M-5 0 l3 3 l7 -7" stroke="#198038" stroke-width="2" fill="none"/>
        </g>
        
        <text class="item-label" x="50" y="60">Platform Health</text>
        <text class="item-detail" x="50" y="77">All systems operational</text>
        
            <line x1="20" y1="90" x2="430" y2="90" stroke="#e0e0e0" stroke-width="1"/>
            
        <g transform="translate(30, 103)">
            <circle r="10" fill="#198038" opacity="0.2"/>
            <path d="M-5 0 l3 3 l7 -7" stroke="#198038" stroke-width="2" fill="none"/>
        </g>
        
        <text class="item-label" x="50" y="100">Log Ingestion</text>
        <text class="item-detail" x="50" y="117">1.2B events/day</text>
        
            <line x1="20" y1="130" x2="430" y2="130" stroke="#e0e0e0" stroke-width="1"/>
            
        <g transform="translate(30, 143)">
            <circle r="10" fill="#f1c21b" opacity="0.2"/>
            <path d="M0 -6 v8 M0 5 v1" stroke="#f1c21b" stroke-width="2" fill="none"/>
        </g>
        
        <text class="item-label" x="50" y="140">Alert Queue</text>
        <text class="item-detail" x="50" y="157">12 pending review</text>
        
            <line x1="20" y1="170" x2="430" y2="170" stroke="#e0e0e0" stroke-width="1"/>
            
        <g transform="translate(30, 183)">
            <circle r="10" fill="#198038" opacity="0.2"/>
            <path d="M-5 0 l3 3 l7 -7" stroke="#198038" stroke-width="2" fill="none"/>
        </g>
        
        <text class="item-label" x="50" y="180">Storage</text>
        <text class="item-detail" x="50" y="197">45% utilized</text>
        
            <line x1="20" y1="210" x2="430" y2="210" stroke="#e0e0e0" stroke-width="1"/>
            
        <g transform="translate(30, 223)">
            <circle r="10" fill="#198038" opacity="0.2"/>
            <path d="M-5 0 l3 3 l7 -7" stroke="#198038" stroke-width="2" fill="none"/>
        </g>
        
        <text class="item-label" x="50" y="220">Backup</text>
        <text class="item-detail" x="50" y="237">Last: 2 hours ago</text>
        </svg>