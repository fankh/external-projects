
    <svg width="1100" height="180" xmlns="http://www.w3.org/2000/svg">
        
    <defs>
        <linearGradient id="gradient_blue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#4589ff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0f62fe;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="gradient_success" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#a7f0ba;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#198038;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="gradient_purple" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#e8daff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#8a3ffc;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="gradient_dark" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#393939;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1c1c1c;stop-opacity:1" />
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#161616" flood-opacity="0.15"/>
        </filter>
        <filter id="shadow_light" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#161616" flood-opacity="0.1"/>
        </filter>
    </defs>
    
        <style>
            .kpi-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #6f6f6f; text-anchor: middle; }
            .kpi-value { font-family: 'Segoe UI', Arial, sans-serif; font-size: 32px; font-weight: 700; text-anchor: middle; }
            .kpi-unit { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 500; }
            .kpi-target { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; fill: #8d8d8d; text-anchor: middle; }
        </style>

        <!-- Background -->
        <rect width="1100" height="180" fill="#ffffff" rx="8"/>
    
        <g transform="translate(20, 20)">
            <!-- Card -->
            <rect width="164" height="140" rx="8" fill="#ffffff"
                  stroke="#e0e0e0" stroke-width="1" filter="url(#shadow_light)"/>

            <!-- Top accent bar -->
            <rect width="164" height="4" rx="8" fill="#198038"/>
            <rect x="0" y="4" width="164" height="4" fill="#ffffff"/>

            <!-- Label -->
            <text class="kpi-label" x="82" y="35">Uptime</text>

            <!-- Value -->
            <text class="kpi-value" x="77" y="85" fill="#198038">99.9</text>
            <text class="kpi-unit" x="122" y="85" fill="#198038">%</text>

            <!-- Target -->
            <text class="kpi-target" x="82" y="115">Target: 99.5%</text>

            <!-- Status indicator -->
            <circle cx="149" cy="15" r="6" fill="#198038"/>
        </g>
        
        <g transform="translate(199, 20)">
            <!-- Card -->
            <rect width="164" height="140" rx="8" fill="#ffffff"
                  stroke="#e0e0e0" stroke-width="1" filter="url(#shadow_light)"/>

            <!-- Top accent bar -->
            <rect width="164" height="4" rx="8" fill="#198038"/>
            <rect x="0" y="4" width="164" height="4" fill="#ffffff"/>

            <!-- Label -->
            <text class="kpi-label" x="82" y="35">Search Time</text>

            <!-- Value -->
            <text class="kpi-value" x="77" y="85" fill="#198038">2.1</text>
            <text class="kpi-unit" x="112" y="85" fill="#198038">s</text>

            <!-- Target -->
            <text class="kpi-target" x="82" y="115">Target: 5s</text>

            <!-- Status indicator -->
            <circle cx="149" cy="15" r="6" fill="#198038"/>
        </g>
        
        <g transform="translate(378, 20)">
            <!-- Card -->
            <rect width="164" height="140" rx="8" fill="#ffffff"
                  stroke="#e0e0e0" stroke-width="1" filter="url(#shadow_light)"/>

            <!-- Top accent bar -->
            <rect width="164" height="4" rx="8" fill="#198038"/>
            <rect x="0" y="4" width="164" height="4" fill="#ffffff"/>

            <!-- Label -->
            <text class="kpi-label" x="82" y="35">Index Latency</text>

            <!-- Value -->
            <text class="kpi-value" x="77" y="85" fill="#198038">18</text>
            <text class="kpi-unit" x="102" y="85" fill="#198038">s</text>

            <!-- Target -->
            <text class="kpi-target" x="82" y="115">Target: 30s</text>

            <!-- Status indicator -->
            <circle cx="149" cy="15" r="6" fill="#198038"/>
        </g>
        
        <g transform="translate(557, 20)">
            <!-- Card -->
            <rect width="164" height="140" rx="8" fill="#ffffff"
                  stroke="#e0e0e0" stroke-width="1" filter="url(#shadow_light)"/>

            <!-- Top accent bar -->
            <rect width="164" height="4" rx="8" fill="#198038"/>
            <rect x="0" y="4" width="164" height="4" fill="#ffffff"/>

            <!-- Label -->
            <text class="kpi-label" x="82" y="35">Storage</text>

            <!-- Value -->
            <text class="kpi-value" x="77" y="85" fill="#198038">45</text>
            <text class="kpi-unit" x="102" y="85" fill="#198038">%</text>

            <!-- Target -->
            <text class="kpi-target" x="82" y="115">Target: 80%</text>

            <!-- Status indicator -->
            <circle cx="149" cy="15" r="6" fill="#198038"/>
        </g>
        
        <g transform="translate(736, 20)">
            <!-- Card -->
            <rect width="164" height="140" rx="8" fill="#ffffff"
                  stroke="#e0e0e0" stroke-width="1" filter="url(#shadow_light)"/>

            <!-- Top accent bar -->
            <rect width="164" height="4" rx="8" fill="#198038"/>
            <rect x="0" y="4" width="164" height="4" fill="#ffffff"/>

            <!-- Label -->
            <text class="kpi-label" x="82" y="35">CPU (avg)</text>

            <!-- Value -->
            <text class="kpi-value" x="77" y="85" fill="#198038">42</text>
            <text class="kpi-unit" x="102" y="85" fill="#198038">%</text>

            <!-- Target -->
            <text class="kpi-target" x="82" y="115">Target: 70%</text>

            <!-- Status indicator -->
            <circle cx="149" cy="15" r="6" fill="#198038"/>
        </g>
        
        <g transform="translate(915, 20)">
            <!-- Card -->
            <rect width="164" height="140" rx="8" fill="#ffffff"
                  stroke="#e0e0e0" stroke-width="1" filter="url(#shadow_light)"/>

            <!-- Top accent bar -->
            <rect width="164" height="4" rx="8" fill="#198038"/>
            <rect x="0" y="4" width="164" height="4" fill="#ffffff"/>

            <!-- Label -->
            <text class="kpi-label" x="82" y="35">Memory</text>

            <!-- Value -->
            <text class="kpi-value" x="77" y="85" fill="#198038">68</text>
            <text class="kpi-unit" x="102" y="85" fill="#198038">%</text>

            <!-- Target -->
            <text class="kpi-target" x="82" y="115">Target: 85%</text>

            <!-- Status indicator -->
            <circle cx="149" cy="15" r="6" fill="#198038"/>
        </g>
        </svg>