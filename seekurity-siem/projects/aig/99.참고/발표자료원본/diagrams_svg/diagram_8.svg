
    <svg width="1100" height="430" xmlns="http://www.w3.org/2000/svg">
        
    <defs>
        <linearGradient id="gradient_blue" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#4589ff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0f62fe;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="gradient_success" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#a7f0ba;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#198038;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="gradient_purple" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#e8daff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#8a3ffc;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="gradient_dark" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#393939;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1c1c1c;stop-opacity:1" />
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#161616" flood-opacity="0.15"/>
        </filter>
        <filter id="shadow_light" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#161616" flood-opacity="0.1"/>
        </filter>
    </defs>
    
        <style>
            .role-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
            .role-subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; fill: #ffffff; text-anchor: middle; opacity: 0.8; }
            .team-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #525252; }
            .connector { stroke: #a8a8a8; stroke-width: 2; fill: none; }
            .connector-dashed { stroke: #a8a8a8; stroke-width: 2; fill: none; stroke-dasharray: 6,3; }
        </style>

        <!-- Background -->
        <rect width="1100" height="430" fill="#ffffff" rx="8"/>

        <!-- Seekurity Team Column -->
        <g transform="translate(50, 30)">
            <rect width="350" height="390" rx="8" fill="#0f62fe" opacity="0.05" stroke="#0f62fe" stroke-width="2"/>
            <text class="team-label" x="175" y="25" text-anchor="middle" fill="#0f62fe">SEEKURITY</text>

            <!-- Project Sponsor -->
            <g transform="translate(100, 50)">
                <rect width="150" height="60" rx="6" fill="#0353e9" filter="url(#shadow_light)"/>
                <text class="role-title" x="75" y="28">Project Sponsor</text>
                <text class="role-subtitle" x="75" y="45">Executive Decisions</text>
            </g>

            <!-- Project Manager -->
            <g transform="translate(100, 140)">
                <rect width="150" height="60" rx="6" fill="#0f62fe" filter="url(#shadow_light)"/>
                <text class="role-title" x="75" y="28">Project Manager</text>
                <text class="role-subtitle" x="75" y="45">Delivery & Reporting</text>
            </g>

            <!-- Technical Lead -->
            <g transform="translate(100, 230)">
                <rect width="150" height="60" rx="6" fill="#4589ff" filter="url(#shadow_light)"/>
                <text class="role-title" x="75" y="28">Technical Lead</text>
                <text class="role-subtitle" x="75" y="45">Architecture & Design</text>
            </g>

            <!-- Engineers -->
            <g transform="translate(50, 320)">
                <rect width="100" height="50" rx="6" fill="#009d9a" filter="url(#shadow_light)"/>
                <text class="role-title" x="50" y="22" font-size="12">Engineer</text>
                <text class="role-subtitle" x="50" y="38">Implementation</text>
            </g>
            <g transform="translate(200, 320)">
                <rect width="100" height="50" rx="6" fill="#8a3ffc" filter="url(#shadow_light)"/>
                <text class="role-title" x="50" y="22" font-size="12">Analyst</text>
                <text class="role-subtitle" x="50" y="38">Use Cases</text>
            </g>

            <!-- Internal connectors -->
            <line class="connector" x1="175" y1="110" x2="175" y2="140"/>
            <line class="connector" x1="175" y1="200" x2="175" y2="230"/>
            <line class="connector" x1="175" y1="290" x2="100" y2="320"/>
            <line class="connector" x1="175" y1="290" x2="250" y2="320"/>
        </g>

        <!-- Customer Team Column -->
        <g transform="translate(500, 30)">
            <rect width="350" height="390" rx="8" fill="#198038" opacity="0.05" stroke="#198038" stroke-width="2"/>
            <text class="team-label" x="175" y="25" text-anchor="middle" fill="#198038">CUSTOMER</text>

            <!-- Project Sponsor -->
            <g transform="translate(100, 50)">
                <rect width="150" height="60" rx="6" fill="#198038" filter="url(#shadow_light)"/>
                <text class="role-title" x="75" y="28">Project Sponsor</text>
                <text class="role-subtitle" x="75" y="45">Budget & Approval</text>
            </g>

            <!-- Project Manager -->
            <g transform="translate(100, 140)">
                <rect width="150" height="60" rx="6" fill="#198038" filter="url(#shadow_light)" opacity="0.85"/>
                <text class="role-title" x="75" y="28">Project Manager</text>
                <text class="role-subtitle" x="75" y="45">Coordination</text>
            </g>

            <!-- Technical Lead -->
            <g transform="translate(100, 230)">
                <rect width="150" height="60" rx="6" fill="#198038" filter="url(#shadow_light)" opacity="0.7"/>
                <text class="role-title" x="75" y="28">Technical Lead</text>
                <text class="role-subtitle" x="75" y="45">Infrastructure</text>
            </g>

            <!-- Team Members -->
            <g transform="translate(50, 320)">
                <rect width="100" height="50" rx="6" fill="#1192e8" filter="url(#shadow_light)"/>
                <text class="role-title" x="50" y="22" font-size="12">Security</text>
                <text class="role-subtitle" x="50" y="38">Requirements</text>
            </g>
            <g transform="translate(200, 320)">
                <rect width="100" height="50" rx="6" fill="#ee5396" filter="url(#shadow_light)"/>
                <text class="role-title" x="50" y="22" font-size="12">IT Ops</text>
                <text class="role-subtitle" x="50" y="38">Access</text>
            </g>

            <!-- Internal connectors -->
            <line class="connector" x1="675" y1="110" x2="675" y2="140"/>
            <line class="connector" x1="675" y1="200" x2="675" y2="230"/>
            <line class="connector" x1="675" y1="290" x2="600" y2="320"/>
            <line class="connector" x1="675" y1="290" x2="750" y2="320"/>
        </g>

        <!-- Cross-team connectors (horizontal) -->
        <g>
            <!-- Sponsor level -->
            <line class="connector-dashed" x1="300" y1="110" x2="600" y2="110"/>
            <text font-family="Segoe UI" font-size="9" fill="#8d8d8d" x="450" y="100" text-anchor="middle">Escalation</text>

            <!-- PM level -->
            <line class="connector" x1="300" y1="200" x2="600" y2="200"/>
            <text font-family="Segoe UI" font-size="9" fill="#8d8d8d" x="450" y="190" text-anchor="middle">Weekly Status</text>

            <!-- Tech lead level -->
            <line class="connector" x1="300" y1="290" x2="600" y2="290"/>
            <text font-family="Segoe UI" font-size="9" fill="#8d8d8d" x="450" y="280" text-anchor="middle">Daily Standup</text>
        </g>
    </svg>
    