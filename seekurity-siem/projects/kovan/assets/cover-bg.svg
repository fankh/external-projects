<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#1B3A5C"/>
    </linearGradient>
    <radialGradient id="glow1" cx="80%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="70%" r="35%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow1)"/>
  <rect width="1280" height="720" fill="url(#glow2)"/>

  <!-- Circuit lines -->
  <g stroke="#00D4FF" stroke-width="0.5" opacity="0.15">
    <line x1="100" y1="0" x2="100" y2="720"/>
    <line x1="300" y1="0" x2="300" y2="720"/>
    <line x1="500" y1="0" x2="500" y2="720"/>
    <line x1="700" y1="0" x2="700" y2="720"/>
    <line x1="900" y1="0" x2="900" y2="720"/>
    <line x1="1100" y1="0" x2="1100" y2="720"/>
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="300" x2="1280" y2="300"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
  </g>

  <!-- Diagonal accent lines -->
  <g stroke="#00D4FF" stroke-width="1" opacity="0.1">
    <line x1="0" y1="200" x2="400" y2="0"/>
    <line x1="880" y1="720" x2="1280" y2="520"/>
    <line x1="0" y1="520" x2="200" y2="720"/>
    <line x1="1080" y1="0" x2="1280" y2="200"/>
  </g>

  <!-- Network nodes -->
  <g fill="#00D4FF" opacity="0.25">
    <circle cx="100" cy="120" r="3"/>
    <circle cx="300" cy="300" r="4"/>
    <circle cx="500" cy="120" r="3"/>
    <circle cx="700" cy="480" r="3"/>
    <circle cx="900" cy="300" r="4"/>
    <circle cx="1100" cy="120" r="3"/>
    <circle cx="300" cy="600" r="3"/>
    <circle cx="500" cy="480" r="4"/>
    <circle cx="900" cy="600" r="3"/>
    <circle cx="1100" cy="480" r="3"/>
  </g>

  <!-- Connection lines between nodes -->
  <g stroke="#00D4FF" stroke-width="0.8" opacity="0.12">
    <line x1="100" y1="120" x2="300" y2="300"/>
    <line x1="300" y1="300" x2="500" y2="120"/>
    <line x1="500" y1="120" x2="900" y2="300"/>
    <line x1="900" y1="300" x2="1100" y2="120"/>
    <line x1="300" y1="300" x2="500" y2="480"/>
    <line x1="500" y1="480" x2="700" y2="480"/>
    <line x1="700" y1="480" x2="900" y2="600"/>
    <line x1="300" y1="600" x2="500" y2="480"/>
    <line x1="900" y1="300" x2="1100" y2="480"/>
  </g>

  <!-- Hexagonal shapes (subtle) -->
  <g stroke="#3B82F6" stroke-width="0.5" fill="none" opacity="0.08">
    <polygon points="1050,80 1090,60 1130,80 1130,120 1090,140 1050,120"/>
    <polygon points="150,550 190,530 230,550 230,590 190,610 150,590"/>
    <polygon points="850,500 890,480 930,500 930,540 890,560 850,540"/>
  </g>

  <!-- Shield icon (large, subtle) -->
  <g transform="translate(1000, 200)" opacity="0.04" fill="#00D4FF">
    <path d="M0-80 L60-50 L60 20 L0 60 L-60 20 L-60-50 Z" stroke="#00D4FF" stroke-width="2" fill="none"/>
    <path d="M0-60 L45-35 L45 15 L0 45 L-45 15 L-45-35 Z"/>
  </g>

  <!-- Data flow dots -->
  <g fill="#00D4FF" opacity="0.3">
    <circle cx="200" cy="210" r="1.5"/>
    <circle cx="400" cy="210" r="1.5"/>
    <circle cx="600" cy="300" r="1.5"/>
    <circle cx="800" cy="390" r="1.5"/>
    <circle cx="1000" cy="210" r="1.5"/>
    <circle cx="400" cy="540" r="1.5"/>
    <circle cx="800" cy="540" r="1.5"/>
  </g>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1280" height="4" fill="#00D4FF" opacity="0.6"/>

  <!-- Bottom subtle line -->
  <line x1="0" y1="716" x2="1280" y2="716" stroke="#00D4FF" stroke-width="1" opacity="0.2"/>
</svg>
