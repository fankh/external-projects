# 온프레미스 배포 예시 — 포털 + nginx 리버스 프록시.
# 사용:  cd portal-web && docker compose -f deploy/docker-compose.yml up -d --build
services:
  portal:
    build:
      context: ..
    restart: unless-stopped
    environment:
      # 세션 쿠키 서명 키 — 실배포에서는 반드시 랜덤 키로 교체한다
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET 를 설정하세요}
      # 고객사 프로필 — 미설정 시 기본(데모), 예: manufacturer (한 이미지 다중 고객사)
      PORTAL_PROFILE: ${PORTAL_PROFILE:-}
      # HTTPS 종단(nginx TLS) 배포에서는 1 로 설정해 세션 쿠키에 Secure 를 붙인다
      PORTAL_COOKIE_SECURE: ${PORTAL_COOKIE_SECURE:-0}
    volumes:
      - portal-data:/data
    # 내부 포트 3400 — 외부 노출은 nginx 만 담당한다

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - portal

volumes:
  portal-data:
